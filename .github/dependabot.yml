version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint 8.x currently supports TypeScript below 6.1 only.
      - dependency-name: typescript
        versions: [">= 7.0.0 < 8.0.0"]
      # Keep development types aligned with the Node 24 CI baseline.
      - dependency-name: "@types/node"
        versions: [">= 25.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
