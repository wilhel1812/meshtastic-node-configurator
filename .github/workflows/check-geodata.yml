name: Check Kartverket contracts

on:
  schedule:
    - cron: "21 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: contract
        continue-on-error: true
        run: node scripts/check-geodata.mjs
      - if: steps.contract.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create geodata-drift --description "Kartverket contract changes" --color D93F0B --force
          existing=$(gh issue list --state open --label geodata-drift --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The scheduled Kartverket contract check is still failing. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          else
            gh issue create --title "Kartverket service contract drift" --label geodata-drift --body "The scheduled Kartverket contract check failed. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
      - name: Close recovered contract alerts
        if: steps.contract.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label geodata-drift --json number --jq '.[].number' |
            while read -r number; do
              gh issue close "$number" --reason completed
            done
